name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # Dummy values so `prisma generate` / PrismaClient construction and the Next
  # build succeed in CI. No real database is contacted: pages are dynamic (no
  # queries at build time), and the smoke tests only hit DB-free routes.
  DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
  DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # prisma generate + next build (lint + typecheck)
      - run: npm run test:run # vitest unit tests

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e # Playwright boots `next dev` and runs the smoke spec
